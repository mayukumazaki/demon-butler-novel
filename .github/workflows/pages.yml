name: Publish novel reading room
on:
  push:
    branches: [main]
    paths: [site.zip, content-manifest.json, verify_public.py, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: novel-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack complete novel
        run: |
          echo '25ea2afe48f74ca4d182313ef8133ff09bed27e75ff74a9b0882182879f66c12  site.zip' | sha256sum --check
          mkdir site
          unzip -q site.zip -d site
          python3 verify_public.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
